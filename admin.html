<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>alvakry.admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Theme tokens (mirrors index.html exactly) ── */
    [data-theme="light"] {
      --bg:        #f8f7f5;
      --bg-nav:    rgba(248,247,245,0.88);
      --fg:        #0d0d0d;
      --muted:     #888;
      --border:    rgba(0,0,0,0.09);
      --accent2:   #c8ff00;
      --body-text: #444;
    }
    [data-theme="dark"] {
      --bg:        #0e0e0e;
      --bg-nav:    rgba(14,14,14,0.88);
      --fg:        #f0ede8;
      --muted:     #666;
      --border:    rgba(255,255,255,0.09);
      --accent2:   #c8ff00;
      --body-text: #aaa;
    }

    :root {
      --max:  720px;
      --mono: 'Space Mono', monospace;
      --sans: 'Space Grotesk', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      line-height: 1.65;
      transition: background 0.3s, color 0.3s;
    }

    /* ── Login screen ── */
    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      flex-direction: column;
      gap: 1.5rem;
      padding: 2rem;
    }
    .login-box {
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .login-title {
      font-family: var(--mono);
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
    .login-title strong {
      color: var(--fg);
      display: block;
      font-size: 1.4rem;
      font-family: var(--sans);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
    }

    /* ── Panel ── */
    .panel { display: none; min-height: 100vh; background: var(--bg); color: var(--fg); font-family: var(--sans); }
    .panel.active { display: flex; flex-direction: column; }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 2rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg-nav);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .panel-header .brand {
      font-family: var(--mono);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      color: var(--fg);
    }
    .panel-header .brand span { color: var(--muted); }
    .header-actions { display: flex; gap: 0.5rem; align-items: center; }

    .panel-body { display: flex; flex: 1; min-height: 0; }

    .sidebar {
      width: 200px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      padding: 2rem 0;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .sidebar-item {
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      color: var(--muted);
      padding: 0.6rem 1.75rem;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
      border: none;
      background: none;
      text-align: left;
      width: 100%;
    }
    .sidebar-item:hover { color: var(--fg); }
    .sidebar-item.active { color: var(--fg); background: var(--border); }
    .sidebar-item::before { content: './'; opacity: 0.4; margin-right: 0.1rem; }

    .main-area {
      flex: 1;
      padding: 2.5rem 3rem;
      overflow-y: auto;
      max-width: 820px;
    }

    .section-view { display: none; }
    .section-view.active { display: block; }

    .section-heading {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* ── Admin list ── */
    .admin-list { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 2rem; }
    .admin-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1rem;
      border: 1px solid var(--border);
      border-radius: 3px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .admin-list-item:hover { border-color: var(--fg); }
    .admin-list-item.selected { border-color: var(--accent2); }
    .admin-list-item-title {
      font-size: 0.88rem;
      font-weight: 500;
    }
    .admin-list-item-meta {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--muted);
    }
    .item-actions { display: flex; gap: 0.4rem; }

    /* ── Form ── */
    .admin-form { display: flex; flex-direction: column; gap: 1.25rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .form-group label {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--fg);
      font-family: var(--sans);
      font-size: 0.88rem;
      padding: 0.6rem 0.8rem;
      transition: border-color 0.15s;
      width: 100%;
      resize: vertical;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--fg);
    }
    .form-group textarea { min-height: 120px; font-family: var(--mono); font-size: 0.8rem; }
    .form-group textarea.tall { min-height: 200px; }

    /* ── Buttons ── */
    .btn-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .btn {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      padding: 0.5rem 1.2rem;
      border: 1px solid var(--fg);
      background: transparent;
      color: var(--fg);
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .btn:hover { background: var(--fg); color: var(--bg); }
    .btn.primary { background: var(--fg); color: var(--bg); }
    .btn.primary:hover { opacity: 0.8; }
    .btn.danger { border-color: #ef4444; color: #ef4444; background: transparent; }
    .btn.danger:hover { background: #ef4444; color: #fff; }
    .btn.small { padding: 0.3rem 0.75rem; font-size: 0.65rem; }

    .save-status {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: #22c55e;
      opacity: 0;
      transition: opacity 0.3s;
      margin-left: 1rem;
    }
    .save-status.show { opacity: 1; }

    /* ── Field group header ── */
    .field-group-header {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent2);
      margin: 1.5rem 0 0.75rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--border);
    }
    /* suppress extra top margin on first field-group-header in a form */
    .admin-form > .field-group-header:first-child,
    #workForm > .field-group-header:first-child,
    #thoughtForm > .field-group-header:first-child { margin-top: 0; }

    /* ── Empty state ── */
    .empty-state {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--muted);
      padding: 2rem 0;
      text-align: center;
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .panel-body { flex-direction: column; }
      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--border);
        flex-direction: row;
        padding: 0.75rem 1rem;
        overflow-x: auto;
        gap: 0;
      }
      .sidebar-item { padding: 0.5rem 1rem; white-space: nowrap; }
      .main-area { padding: 1.5rem; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- ═══════════════════════ LOGIN ═══════════════════════ -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-title">
      <strong>alvakry.admin</strong>
      system access — state your purpose
    </div>
    <div class="form-group">
      <label>password</label>
      <input type="password" id="pwInput" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <div id="loginError" style="font-family:var(--mono);font-size:0.72rem;color:#ef4444;display:none;">access denied. try again.</div>
    <button class="btn primary" id="loginBtn">enter →</button>
  </div>
</div>

<!-- ═══════════════════════ PANEL ═══════════════════════ -->
<div class="panel" id="panel">
  <div class="panel-header">
    <span class="brand">alvakry<span>.admin</span></span>
    <div class="header-actions">
      <button class="btn small" id="themeBtn">toggle theme</button>
      <button class="btn small danger" id="logoutBtn">logout</button>
    </div>
  </div>

  <div class="panel-body">
    <!-- Sidebar -->
    <div class="sidebar">
      <button class="sidebar-item active" data-section="works">works</button>
      <button class="sidebar-item" data-section="thoughts">thoughts</button>
      <button class="sidebar-item" data-section="settings">settings</button>
    </div>

    <!-- Main area -->
    <div class="main-area">

      <!-- ── Works ── -->
      <div class="section-view active" id="section-works">
        <div class="section-heading">
          <span>Works</span>
          <button class="btn small" id="addWorkBtn">+ add work</button>
        </div>
        <div class="admin-list" id="workList"></div>
        <div id="workForm" style="display:none;">
          <div class="field-group-header">title</div>
          <div class="form-row">
            <div class="form-group"><label>title (EN)</label><input type="text" id="wTitleEn" /></div>
            <div class="form-group"><label>title (ID)</label><input type="text" id="wTitleId" /></div>
          </div>
          <div class="field-group-header">meta</div>
          <div class="form-row">
            <div class="form-group"><label>category (EN)</label><input type="text" id="wCatEn" /></div>
            <div class="form-group"><label>category (ID)</label><input type="text" id="wCatId" /></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>year</label><input type="text" id="wYear" /></div>
            <div class="form-group"><label>tags (comma-separated)</label><input type="text" id="wTags" /></div>
          </div>
          <div class="field-group-header">description (short)</div>
          <div class="form-row">
            <div class="form-group"><label>description (EN)</label><textarea id="wDescEn"></textarea></div>
            <div class="form-group"><label>description (ID)</label><textarea id="wDescId"></textarea></div>
          </div>
          <div class="field-group-header">body (HTML, full article)</div>
          <div class="form-group"><label>body (EN)</label><textarea class="tall" id="wBodyEn"></textarea></div>
          <div class="form-group"><label>body (ID)</label><textarea class="tall" id="wBodyId"></textarea></div>
          <div style="display:flex;gap:0.5rem;margin-top:1rem;align-items:center;">
            <button class="btn primary" id="saveWorkBtn">save work</button>
            <button class="btn" id="cancelWorkBtn">cancel</button>
            <span class="save-status" id="workSaveStatus">saved ✓</span>
          </div>
        </div>
      </div>

      <!-- ── Thoughts ── -->
      <div class="section-view" id="section-thoughts">
        <div class="section-heading">
          <span>Thoughts</span>
          <button class="btn small" id="addThoughtBtn">+ add thought</button>
        </div>
        <div class="admin-list" id="thoughtList"></div>
        <div id="thoughtForm" style="display:none;">
          <div class="field-group-header">title</div>
          <div class="form-row">
            <div class="form-group"><label>title (EN)</label><input type="text" id="tTitleEn" /></div>
            <div class="form-group"><label>title (ID)</label><input type="text" id="tTitleId" /></div>
          </div>
          <div class="form-group" style="max-width:200px;"><label>date (e.g. Oct 2026)</label><input type="text" id="tDate" /></div>
          <div class="field-group-header">body (HTML, full article)</div>
          <div class="form-group"><label>body (EN)</label><textarea class="tall" id="tBodyEn"></textarea></div>
          <div class="form-group"><label>body (ID)</label><textarea class="tall" id="tBodyId"></textarea></div>
          <div style="display:flex;gap:0.5rem;margin-top:1rem;align-items:center;">
            <button class="btn primary" id="saveThoughtBtn">save thought</button>
            <button class="btn" id="cancelThoughtBtn">cancel</button>
            <span class="save-status" id="thoughtSaveStatus">saved ✓</span>
          </div>
        </div>
      </div>

      <!-- ── Settings ── -->
      <div class="section-view" id="section-settings">
        <div class="section-heading"><span>Settings</span></div>
        <div class="admin-form" id="settingsForm">
          <div class="field-group-header">hero headline</div>
          <div class="form-row">
            <div class="form-group"><label>headline (EN)</label><input type="text" id="sHeroEn" /></div>
            <div class="form-group"><label>headline (ID)</label><input type="text" id="sHeroId" /></div>
          </div>
          <div class="field-group-header">hero subtitle</div>
          <div class="form-row">
            <div class="form-group"><label>subtitle (EN)</label><textarea id="sSubEn"></textarea></div>
            <div class="form-group"><label>subtitle (ID)</label><textarea id="sSubId"></textarea></div>
          </div>
          <div class="field-group-header">about text</div>
          <div class="form-row">
            <div class="form-group"><label>about (EN)</label><textarea class="tall" id="sAboutEn"></textarea></div>
            <div class="form-group"><label>about (ID)</label><textarea class="tall" id="sAboutId"></textarea></div>
          </div>
          <div class="field-group-header">status text</div>
          <div class="form-row">
            <div class="form-group"><label>status (EN)</label><input type="text" id="sStatusEn" /></div>
            <div class="form-group"><label>status (ID)</label><input type="text" id="sStatusId" /></div>
          </div>
          <div class="field-group-header">contact intro</div>
          <div class="form-row">
            <div class="form-group"><label>contact intro (EN)</label><textarea id="sContactEn"></textarea></div>
            <div class="form-group"><label>contact intro (ID)</label><textarea id="sContactId"></textarea></div>
          </div>
          <div style="display:flex;gap:0.5rem;margin-top:1rem;align-items:center;">
            <button class="btn primary" id="saveSettingsBtn">save settings</button>
            <button class="btn danger" id="resetBtn">reset to defaults</button>
            <span class="save-status" id="settingsSaveStatus">saved ✓</span>
          </div>
        </div>
      </div>

    </div><!-- /main-area -->
  </div><!-- /panel-body -->
</div><!-- /panel -->

<script src="data.js"></script>
<script>
(function () {
  /* ════════════════════════════════════════
     THEME
  ════════════════════════════════════════ */
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
  }

  function toggleTheme() {
    var cur = document.documentElement.getAttribute('data-theme');
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  }

  // Apply saved theme immediately
  (function () {
    var saved = localStorage.getItem('theme') ||
      (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(saved);
  })();

  document.getElementById('themeBtn').addEventListener('click', toggleTheme);

  /* ════════════════════════════════════════
     AUTH
  ════════════════════════════════════════ */
  var PASSWORD = 'alvakry2026';

  function checkAuth() {
    if (sessionStorage.getItem('admin_auth') === '1') {
      showPanel();
    } else {
      showLogin();
    }
  }

  function showLogin() {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('panel').classList.remove('active');
  }

  function showPanel() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('panel').classList.add('active');
    initPanel();
  }

  document.getElementById('loginBtn').addEventListener('click', function () {
    var pw = document.getElementById('pwInput').value;
    var errEl = document.getElementById('loginError');
    if (pw === PASSWORD) {
      sessionStorage.setItem('admin_auth', '1');
      errEl.style.display = 'none';
      showPanel();
    } else {
      errEl.style.display = 'block';
    }
  });

  // Allow Enter key on password input
  document.getElementById('pwInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('loginBtn').click();
  });

  document.getElementById('logoutBtn').addEventListener('click', function () {
    sessionStorage.removeItem('admin_auth');
    window.location.reload();
  });

  /* ════════════════════════════════════════
     PANEL INIT (runs after auth confirmed)
  ════════════════════════════════════════ */
  function initPanel() {
    initSidebar();
    renderWorkList();
    renderThoughtList();
    loadSettings();
  }

  /* ════════════════════════════════════════
     SIDEBAR NAVIGATION
  ════════════════════════════════════════ */
  function initSidebar() {
    document.querySelectorAll('.sidebar-item').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.sidebar-item').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        var target = btn.getAttribute('data-section');
        document.querySelectorAll('.section-view').forEach(function (v) { v.classList.remove('active'); });
        var view = document.getElementById('section-' + target);
        if (view) view.classList.add('active');
      });
    });
  }

  /* ════════════════════════════════════════
     PERSIST DATA
  ════════════════════════════════════════ */
  function persistData() {
    localStorage.setItem('alvakry_data', JSON.stringify(window.PORTFOLIO_DATA));
  }

  /* ════════════════════════════════════════
     SHOW SAVE STATUS
  ════════════════════════════════════════ */
  function showSaveStatus(id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.classList.add('show');
    setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  /* ════════════════════════════════════════
     WORKS CRUD
  ════════════════════════════════════════ */
  var editingWorkId = null;

  function renderWorkList() {
    var list = document.getElementById('workList');
    list.innerHTML = '';
    var works = window.PORTFOLIO_DATA.works;
    if (!works || works.length === 0) {
      list.innerHTML = '<div class="empty-state">no works yet. add one above.</div>';
      return;
    }
    works.forEach(function (w) {
      var titleText = (w.title && typeof w.title === 'object') ? (w.title.en || '') : (w.title || '');
      var metaText  = (w.category && typeof w.category === 'object') ? (w.category.en || '') : (w.category || '');

      var item = document.createElement('div');
      item.className = 'admin-list-item';
      if (editingWorkId === w.id) item.classList.add('selected');

      item.innerHTML =
        '<div>' +
          '<div class="admin-list-item-title">' + escHtml(titleText) + '</div>' +
          '<div class="admin-list-item-meta">' + escHtml(metaText) + ' · ' + escHtml(w.year || '') + '</div>' +
        '</div>' +
        '<div class="item-actions">' +
          '<button class="btn small" data-edit="' + escHtml(w.id) + '">edit</button>' +
          '<button class="btn small danger" data-delete="' + escHtml(w.id) + '">delete</button>' +
        '</div>';

      list.appendChild(item);
    });

    // Bind buttons after render
    list.querySelectorAll('[data-edit]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        openWorkForm(btn.getAttribute('data-edit'));
      });
    });
    list.querySelectorAll('[data-delete]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        deleteWork(btn.getAttribute('data-delete'));
      });
    });
  }

  function openWorkForm(id) {
    editingWorkId = id || null;
    var form = document.getElementById('workForm');
    form.style.display = 'block';

    if (id) {
      var w = window.PORTFOLIO_DATA.works.find(function (x) { return x.id === id; });
      if (!w) return;
      document.getElementById('wTitleEn').value = (w.title && w.title.en) || '';
      document.getElementById('wTitleId').value = (w.title && w.title.id) || '';
      document.getElementById('wCatEn').value   = (w.category && w.category.en) || '';
      document.getElementById('wCatId').value   = (w.category && w.category.id) || '';
      document.getElementById('wYear').value    = w.year || '';
      document.getElementById('wTags').value    = (w.tags && Array.isArray(w.tags)) ? w.tags.join(', ') : '';
      document.getElementById('wDescEn').value  = (w.description && w.description.en) || '';
      document.getElementById('wDescId').value  = (w.description && w.description.id) || '';
      document.getElementById('wBodyEn').value  = (w.body && w.body.en) || '';
      document.getElementById('wBodyId').value  = (w.body && w.body.id) || '';
    } else {
      clearWorkForm();
    }

    renderWorkList(); // refresh selected highlight
    form.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function clearWorkForm() {
    ['wTitleEn','wTitleId','wCatEn','wCatId','wYear','wTags','wDescEn','wDescId','wBodyEn','wBodyId']
      .forEach(function (id) { document.getElementById(id).value = ''; });
  }

  function saveWork() {
    var tagsRaw = document.getElementById('wTags').value;
    var tags = tagsRaw.split(',').map(function (t) { return t.trim(); }).filter(Boolean);

    var work = {
      id:          editingWorkId || Date.now().toString(36),
      title:       { en: document.getElementById('wTitleEn').value, id: document.getElementById('wTitleId').value },
      category:    { en: document.getElementById('wCatEn').value,   id: document.getElementById('wCatId').value },
      year:        document.getElementById('wYear').value,
      tags:        tags,
      description: { en: document.getElementById('wDescEn').value,  id: document.getElementById('wDescId').value },
      body:        { en: document.getElementById('wBodyEn').value,   id: document.getElementById('wBodyId').value }
    };

    var idx = window.PORTFOLIO_DATA.works.findIndex(function (x) { return x.id === work.id; });
    if (idx > -1) {
      window.PORTFOLIO_DATA.works[idx] = work;
    } else {
      window.PORTFOLIO_DATA.works.push(work);
    }

    persistData();
    renderWorkList();
    showSaveStatus('workSaveStatus');
  }

  function deleteWork(id) {
    if (!confirm('Delete this work? This cannot be undone.')) return;
    window.PORTFOLIO_DATA.works = window.PORTFOLIO_DATA.works.filter(function (x) { return x.id !== id; });
    if (editingWorkId === id) {
      editingWorkId = null;
      document.getElementById('workForm').style.display = 'none';
    }
    persistData();
    renderWorkList();
  }

  // Add / Save / Cancel wiring
  document.getElementById('addWorkBtn').addEventListener('click', function () {
    editingWorkId = null;
    openWorkForm(null);
  });
  document.getElementById('saveWorkBtn').addEventListener('click', saveWork);
  document.getElementById('cancelWorkBtn').addEventListener('click', function () {
    editingWorkId = null;
    document.getElementById('workForm').style.display = 'none';
    renderWorkList();
  });

  /* ════════════════════════════════════════
     THOUGHTS CRUD
  ════════════════════════════════════════ */
  var editingThoughtId = null;

  function renderThoughtList() {
    var list = document.getElementById('thoughtList');
    list.innerHTML = '';
    var thoughts = window.PORTFOLIO_DATA.thoughts;
    if (!thoughts || thoughts.length === 0) {
      list.innerHTML = '<div class="empty-state">no thoughts yet. add one above.</div>';
      return;
    }
    thoughts.forEach(function (t) {
      var titleText = (t.title && typeof t.title === 'object') ? (t.title.en || '') : (t.title || '');

      var item = document.createElement('div');
      item.className = 'admin-list-item';
      if (editingThoughtId === t.id) item.classList.add('selected');

      item.innerHTML =
        '<div>' +
          '<div class="admin-list-item-title">' + escHtml(titleText) + '</div>' +
          '<div class="admin-list-item-meta">' + escHtml(t.date || '') + '</div>' +
        '</div>' +
        '<div class="item-actions">' +
          '<button class="btn small" data-edit="' + escHtml(t.id) + '">edit</button>' +
          '<button class="btn small danger" data-delete="' + escHtml(t.id) + '">delete</button>' +
        '</div>';

      list.appendChild(item);
    });

    list.querySelectorAll('[data-edit]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        openThoughtForm(btn.getAttribute('data-edit'));
      });
    });
    list.querySelectorAll('[data-delete]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        deleteThought(btn.getAttribute('data-delete'));
      });
    });
  }

  function openThoughtForm(id) {
    editingThoughtId = id || null;
    var form = document.getElementById('thoughtForm');
    form.style.display = 'block';

    if (id) {
      var t = window.PORTFOLIO_DATA.thoughts.find(function (x) { return x.id === id; });
      if (!t) return;
      document.getElementById('tTitleEn').value = (t.title && t.title.en) || '';
      document.getElementById('tTitleId').value = (t.title && t.title.id) || '';
      document.getElementById('tDate').value    = t.date || '';
      document.getElementById('tBodyEn').value  = (t.body && t.body.en) || '';
      document.getElementById('tBodyId').value  = (t.body && t.body.id) || '';
    } else {
      clearThoughtForm();
    }

    renderThoughtList();
    form.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function clearThoughtForm() {
    ['tTitleEn','tTitleId','tDate','tBodyEn','tBodyId']
      .forEach(function (id) { document.getElementById(id).value = ''; });
  }

  function saveThought() {
    var thought = {
      id:    editingThoughtId || Date.now().toString(36),
      title: { en: document.getElementById('tTitleEn').value, id: document.getElementById('tTitleId').value },
      date:  document.getElementById('tDate').value,
      body:  { en: document.getElementById('tBodyEn').value,  id: document.getElementById('tBodyId').value }
    };

    var idx = window.PORTFOLIO_DATA.thoughts.findIndex(function (x) { return x.id === thought.id; });
    if (idx > -1) {
      window.PORTFOLIO_DATA.thoughts[idx] = thought;
    } else {
      window.PORTFOLIO_DATA.thoughts.push(thought);
    }

    persistData();
    renderThoughtList();
    showSaveStatus('thoughtSaveStatus');
  }

  function deleteThought(id) {
    if (!confirm('Delete this thought? This cannot be undone.')) return;
    window.PORTFOLIO_DATA.thoughts = window.PORTFOLIO_DATA.thoughts.filter(function (x) { return x.id !== id; });
    if (editingThoughtId === id) {
      editingThoughtId = null;
      document.getElementById('thoughtForm').style.display = 'none';
    }
    persistData();
    renderThoughtList();
  }

  document.getElementById('addThoughtBtn').addEventListener('click', function () {
    editingThoughtId = null;
    openThoughtForm(null);
  });
  document.getElementById('saveThoughtBtn').addEventListener('click', saveThought);
  document.getElementById('cancelThoughtBtn').addEventListener('click', function () {
    editingThoughtId = null;
    document.getElementById('thoughtForm').style.display = 'none';
    renderThoughtList();
  });

  /* ════════════════════════════════════════
     SETTINGS
  ════════════════════════════════════════ */
  function loadSettings() {
    var s = window.PORTFOLIO_DATA.settings;
    if (!s) return;
    document.getElementById('sHeroEn').value    = (s.heroHeadline && s.heroHeadline.en) || '';
    document.getElementById('sHeroId').value    = (s.heroHeadline && s.heroHeadline.id) || '';
    document.getElementById('sSubEn').value     = (s.heroSubtitle && s.heroSubtitle.en) || '';
    document.getElementById('sSubId').value     = (s.heroSubtitle && s.heroSubtitle.id) || '';
    document.getElementById('sAboutEn').value   = (s.aboutText && s.aboutText.en) || '';
    document.getElementById('sAboutId').value   = (s.aboutText && s.aboutText.id) || '';
    document.getElementById('sStatusEn').value  = (s.statusText && s.statusText.en) || '';
    document.getElementById('sStatusId').value  = (s.statusText && s.statusText.id) || '';
    document.getElementById('sContactEn').value = (s.contactIntro && s.contactIntro.en) || '';
    document.getElementById('sContactId').value = (s.contactIntro && s.contactIntro.id) || '';
  }

  function saveSettings() {
    if (!window.PORTFOLIO_DATA.settings) window.PORTFOLIO_DATA.settings = {};
    var s = window.PORTFOLIO_DATA.settings;
    s.heroHeadline = { en: document.getElementById('sHeroEn').value,    id: document.getElementById('sHeroId').value };
    s.heroSubtitle = { en: document.getElementById('sSubEn').value,     id: document.getElementById('sSubId').value };
    s.aboutText    = { en: document.getElementById('sAboutEn').value,   id: document.getElementById('sAboutId').value };
    s.statusText   = { en: document.getElementById('sStatusEn').value,  id: document.getElementById('sStatusId').value };
    s.contactIntro = { en: document.getElementById('sContactEn').value, id: document.getElementById('sContactId').value };
    persistData();
    showSaveStatus('settingsSaveStatus');
  }

  document.getElementById('saveSettingsBtn').addEventListener('click', saveSettings);
  document.getElementById('resetBtn').addEventListener('click', function () {
    if (!confirm('Reset all data to defaults? All edits will be lost.')) return;
    localStorage.removeItem('alvakry_data');
    window.location.reload();
  });

  /* ════════════════════════════════════════
     UTILITY
  ════════════════════════════════════════ */
  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* ════════════════════════════════════════
     BOOT
  ════════════════════════════════════════ */
  checkAuth();

})();
</script>
</body>
</html>
